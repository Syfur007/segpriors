# ISIC 2018 (Task 1-2, lesion segmentation) dataset identity fragment.
#
# Verified 2026-08-30 against the official challenge download (train 2594 /
# val 100 / test 1002; loads correctly through StandardSplitDataModule).
#
# Unlike BUSI, ISIC18 ships an official train/val/test split baked into
# its directory structure — no `dataset.split` ratios needed or used here.
dataset:
  name: "ISIC18"
  # `root` points at a pre-resized copy of the official download, not the
  # original — see data/isic18_256/README (generated by
  # scripts/resize_isic18.py). ISIC18's raw images vary wildly in
  # resolution (some multiple megapixels); a single-pair cache-size probe
  # badly underestimated the true average here — the "~7.6 GB" estimate
  # that gated caching on/off was measured (by actually caching it) to
  # really cost ~35-43 GB RSS. That's irrelevant on this repo's own 125 GB
  # host but has since actually OOM-killed a Kaggle worker outright when
  # its attached ISIC18 mount turned out to hold un-resized originals.
  #
  # The fix is a no-op for results, not a shortcut: datasets/augment.py's
  # very first transform is already `A.Resize(img_height, img_width)`
  # before any augmentation runs, so every image was always going to be
  # resized to this study's fixed 256x256 training resolution regardless —
  # doing that resize once on disk instead of on every access just removes
  # the need to ever decode/hold the multi-megapixel originals.
  root: "data/isic18_256"
  # Real resized footprint is ~0.63 GB for the 2594-pair train split (the
  # largest split ever cached at once) — 2.0 GB is generous headroom for
  # that, *and* deliberately tight enough to reject caching outright if
  # `root` ever points at un-resized originals again (~7.6+ GB by the same
  # probe). datasets/dataset.py's _prefetch() also now probes multiple
  # pairs (not just the first) and hard-aborts mid-load if the real running
  # total crosses this limit, so a bad estimate can no longer run past it.
  cache_size_limit_gb: 2.0
