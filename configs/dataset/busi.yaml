# BUSI (Breast Ultrasound Images) dataset identity fragment.
#
# UNVERIFIED against real data (see datasets/busi.py's module docstring) —
# no BUSI files exist in the environment this fragment was authored in.
# Point `root` at your actual download (the `Dataset_BUSI_with_GT` folder,
# containing benign/malignant/normal subfolders) and sanity-check a few
# (image, mask) pairs load correctly before trusting a training run.
#
# BUSI ships no official split, so — unlike clinicdb.yaml/colondb.yaml —
# this fragment also sets `dataset.split` ratios; override them per
# experiment if needed. `dedup: true` (the handler's default) is
# mandatory per the spec, not just this fragment's default — don't set it
# to false except to skip re-running the (slow, one-time) dedup pass on
# data you've already deduplicated.
#
# modality: "grayscale" — BUSI is ultrasound, not colour photography (plan
# §3). This was left at the schema default ("colour") when this fragment
# was first authored, before any BUSI data was on hand — that silently
# made m3 (rgb+ycbcr) compute a real YCbCr transform, and m7
# (rgb+randproj_rgb) a real random projection, from a source image that's
# actually a grayscale frame repeated into 3 identical channels. Both
# degenerate to carrying no more information than plain "rgb" for such a
# source; datasets/channels.py's modality_effective_channels() only
# strips them from channel_order under modality="grayscale". Leaving this
# at "colour" would make every BUSI config generated by
# scripts/gen_iccit_configs.py the wrong width, and would fail the plan's
# mandatory pre-flight check ("m3 and m7 report equal effective channels
# on BUSI") outright.
#
# check_grayscale: true — modality="grayscale" above is a declaration, not
# a guarantee: real BUSI archives include frames with baked-in colour
# Doppler overlays or coloured calipers/text, which are NOT the degenerate
# repeated-gray case modality_effective_channels() assumes. Those images
# would leak real (but purely artifactual) signal through the ycbcr/
# randproj_rgb channels — and since annotations are usually placed on or
# near the lesion, that's a concrete shortcut path for m3/m7 to show a
# spurious effect. preprocess.detect_colour_contamination() flags and
# excludes them; mandatory per the same reasoning as dedup above.
dataset:
  name: "BUSI"
  root: "data/busi/Dataset_BUSI_with_GT"
  modality: "grayscale"
  split:
    train: 0.7
    val: 0.15
    test: 0.15
  dedup: true
  check_grayscale: true
